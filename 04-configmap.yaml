# ⚠️ CONTAINS PLACEHOLDER (<YOUR_ACCOUNT_ID> in s3_bucket_name) — replace before applying.
# Check: grep -nE "<YOUR|<REGION>" 04-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    # ============================================================
    # Model List — add/remove providers as needed
    # ============================================================
    model_list:
      # ── AWS Bedrock Claude (IRSA, no API key needed) ──
      # Fable 5 uses a GLOBAL cross-region inference profile (global. prefix).
      # Bedrock backing regions: us-east-1 + eu-north-1. Pricing is Global CRIS:
      # $10/1M in, $50/1M out, $1/1M cache read, $12.50/1M 5m cache write.
      # NOTE: requires data-sharing opt-in — data leaves the AWS boundary,
      # 30-day retention + human review (unlike other Bedrock models here).
      - model_name: claude-fable-5
        litellm_params:
          model: bedrock/global.anthropic.claude-fable-5
          aws_region_name: us-east-1
          custom_llm_provider: bedrock
          stream_timeout: 900
          input_cost_per_token: 0.00001
          output_cost_per_token: 0.00005
          cache_creation_input_token_cost: 0.0000125
          cache_read_input_token_cost: 0.000001
          cache_creation_input_token_cost_above_1hr: 0.00002
        model_info:
          supports_prompt_caching: true
          max_input_tokens: 1000000
          max_output_tokens: 128000
      # 1M context variant — [1m] suffix triggers client to add beta header
      - model_name: claude-fable-5[1m]
        litellm_params:
          model: bedrock/global.anthropic.claude-fable-5
          aws_region_name: us-east-1
          custom_llm_provider: bedrock
          stream_timeout: 900
          input_cost_per_token: 0.00001
          output_cost_per_token: 0.00005
          cache_creation_input_token_cost: 0.0000125
          cache_read_input_token_cost: 0.000001
          cache_creation_input_token_cost_above_1hr: 0.00002
        model_info:
          supports_prompt_caching: true
          max_input_tokens: 1000000
          max_output_tokens: 128000
      - model_name: claude-opus-5
        litellm_params:
          model: bedrock/us.anthropic.claude-opus-5
          aws_region_name: us-east-1
          stream_timeout: 900
        # Opus 5 后端默认 1M context；thinking 默认开启（与 4.8 不同），max_tokens 需留余量
        model_info:
          max_input_tokens: 1000000
          max_output_tokens: 128000
      - model_name: claude-opus-4-8
        litellm_params:
          model: bedrock/us.anthropic.claude-opus-4-8
          aws_region_name: us-east-1
          stream_timeout: 900
        # Opus 4.8 后端默认 1M context（无需 beta header），显式声明覆盖 LiteLLM 默认 200K
        model_info:
          max_input_tokens: 1000000
          max_output_tokens: 128000
      - model_name: claude-opus-4-7
        litellm_params:
          model: bedrock/us.anthropic.claude-opus-4-7
          aws_region_name: us-east-1
          stream_timeout: 900
        model_info:
          max_input_tokens: 1000000
          max_output_tokens: 128000
      - model_name: claude-opus-4-6
        litellm_params:
          model: bedrock/us.anthropic.claude-opus-4-6-v1
          aws_region_name: us-east-1
          stream_timeout: 900
        model_info:
          max_input_tokens: 1000000
          max_output_tokens: 128000
      - model_name: claude-sonnet-4-6
        litellm_params:
          model: bedrock/us.anthropic.claude-sonnet-4-6
          aws_region_name: us-east-1
          stream_timeout: 900
      # 1M context variant — enabled via anthropic-beta header
      - model_name: claude-sonnet-4-6[1m]
        litellm_params:
          model: bedrock/us.anthropic.claude-sonnet-4-6
          aws_region_name: us-east-1
          stream_timeout: 900
          extra_headers:
            anthropic-beta: "context-1m-2025-08-07"
        model_info:
          max_input_tokens: 1000000
          max_output_tokens: 128000
      - model_name: claude-haiku-4-5
        litellm_params:
          model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
          aws_region_name: us-east-1
          # Haiku 4.5 不支持 extended thinking，丢弃该参数避免 400
          drop_params: true
          additional_drop_params: ["thinking"]

      # ── AWS Bedrock Nova ──
      - model_name: bedrock-nova-premier
        litellm_params:
          model: bedrock/us.amazon.nova-premier-v1:0
          aws_region_name: us-east-1
      - model_name: bedrock-nova-pro
        litellm_params:
          model: bedrock/us.amazon.nova-pro-v1:0
          aws_region_name: us-east-1
      - model_name: bedrock-nova-lite
        litellm_params:
          model: bedrock/us.amazon.nova-lite-v1:0
          aws_region_name: us-east-1
      - model_name: bedrock-nova-micro
        litellm_params:
          model: bedrock/us.amazon.nova-micro-v1:0
          aws_region_name: us-east-1

      # ── Google Gemini (API Key from Secrets Manager) ──
      - model_name: gemini-3.5-flash
        litellm_params:
          model: gemini/gemini-3.5-flash
          api_key: os.environ/GEMINI_API_KEY
      - model_name: gemini-3.1-flash-image
        litellm_params:
          model: gemini/gemini-3.1-flash-image
          api_key: os.environ/GEMINI_API_KEY

      # ── OpenAI GPT on Bedrock Mantle (Responses API) ──
      # Mantle's gpt-5.6/5.5/5.4 only expose /openai/v1/responses, NOT chat/completions.
      # Use openai/ provider + the /openai/v1 base: LiteLLM appends /responses.
      # Clients MUST call the proxy's /v1/responses endpoint (responses.create).
      # GPT-5.6 family (GA 2026-07-13, Responses-only, 1M ctx since 2026-08-03, no geo/global CRIS,
      # in-region only). Sol=flagship; Terra=GPT-5.5 perf @ half cost; Luna=cheapest.
      # Pricing per AWS Bedrock pricing page (matches OpenAI first-party rates).
      - model_name: gpt-5.6-sol
        litellm_params:
          model: openai/openai.gpt-5.6-sol
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
        model_info:
          max_input_tokens: 1048576
          input_cost_per_token: 0.000005
          input_cost_per_token_cache_hit: 0.0000005
          output_cost_per_token: 0.00003
      - model_name: gpt-5.6-terra
        litellm_params:
          model: openai/openai.gpt-5.6-terra
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
        model_info:
          max_input_tokens: 1048576
          input_cost_per_token: 0.0000025
          input_cost_per_token_cache_hit: 0.00000025
          output_cost_per_token: 0.000015
      - model_name: gpt-5.6-luna
        litellm_params:
          model: openai/openai.gpt-5.6-luna
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
        model_info:
          max_input_tokens: 1048576
          input_cost_per_token: 0.000001
          input_cost_per_token_cache_hit: 0.0000001
          output_cost_per_token: 0.000006
      - model_name: gpt-5.5
        litellm_params:
          model: openai/openai.gpt-5.5
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
        model_info:
          max_input_tokens: 272000
          input_cost_per_token: 0.0000055
          input_cost_per_token_cache_hit: 0.00000055
          output_cost_per_token: 0.000033
      - model_name: gpt-5.4
        litellm_params:
          model: openai/openai.gpt-5.4
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
        model_info:
          max_input_tokens: 272000
          input_cost_per_token: 0.00000275
          input_cost_per_token_cache_hit: 0.000000275
          output_cost_per_token: 0.0000165
      # GPT-5.4 Oregon fallback (same model_name → router load-balances/fails over)
      - model_name: gpt-5.4
        litellm_params:
          model: openai/openai.gpt-5.4
          api_base: https://bedrock-mantle.us-west-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
        model_info:
          max_input_tokens: 272000
          input_cost_per_token: 0.00000275
          input_cost_per_token_cache_hit: 0.000000275
          output_cost_per_token: 0.0000165

      # ── xAI Grok on Bedrock Mantle ──
      # Grok 4.3 is us-west-2 (Oregon) ONLY — no geo/global CRIS. Mantle endpoint.
      # Supports BOTH Chat Completions and Responses API (unlike gpt-5.4 which is
      # Responses-only), so clients can call /v1/chat/completions or /v1/responses.
      - model_name: grok-4.3
        litellm_params:
          model: openai/xai.grok-4.3
          api_base: https://bedrock-mantle.us-west-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
        model_info:
          max_input_tokens: 1000000
          input_cost_per_token: 0.00000125
          output_cost_per_token: 0.0000025

      # --- Codex internal-task aliases ---
      # Codex 的 guardian_approval(执行前自动审批)用 OpenAI 原生 slug
      # 调内部任务(codex-auto-review / gpt-5.4-mini / gpt-5 / gpt-5-codex)。
      # 网关没有这些 model 会 400,进而阻断 Codex 的工具调用(含 web search)。
      # 这里把它们映射到真实模型;不关 guardian,保留审批能力。
      - model_name: codex-auto-review
        litellm_params:
          model: openai/openai.gpt-5.5
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
      - model_name: gpt-5.4-mini
        litellm_params:
          model: openai/openai.gpt-5.4
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
      - model_name: gpt-5
        litellm_params:
          model: openai/openai.gpt-5.5
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true
      - model_name: gpt-5-codex
        litellm_params:
          model: openai/openai.gpt-5.5
          api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
          api_key: os.environ/BEDROCK_MANTLE_API_KEY
          drop_params: true

    # ============================================================
    # Router Settings — simple-shuffle routing + fallback
    # ============================================================
    router_settings:
      routing_strategy: simple-shuffle    # Options: simple-shuffle | least-busy | latency-based-routing
      num_retries: 3
      retry_after: 5
      timeout: 1200
      allowed_fails: 2
      cooldown_time: 60
      # Automatic fallback: if external provider fails, use Bedrock Claude
      # Note: gpt-5.5/gpt-5.4 use Responses API and cannot fallback to chat-only models
      fallbacks:
        - {"gemini-3.5-flash": ["claude-sonnet-4-6"]}
        - {"gemini-3.1-flash-image": ["claude-sonnet-4-6"]}
        # opus-4-8 超时/失败时降级到 sonnet-4-6[1m]（1M 上下文，可接住大 context 请求）
        - {"claude-opus-4-8": ["claude-sonnet-4-6[1m]"]}

    # ============================================================
    # LiteLLM Core Settings
    # ============================================================
    litellm_settings:
      # Redis caching: reduces latency for repeated queries
      cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: "6379"
        password: os.environ/REDIS_PASSWORD
        ssl: true
        ttl: 600               # Cache TTL in seconds
        supported_call_types:
          - acompletion
          - completion
          - embedding
      # Callbacks: must use "callbacks" (not success_callback) to enable handler instantiation
      callbacks:
        # Loaded first, for its import-time side effect only: raises the hardcoded
        # 600s httpx default that LiteLLM's /v1/messages route falls back to (that
        # route drops every configured timeout — litellm#26752, fixed upstream in
        # v1.94.0-rc.1). Long non-streaming generations legitimately run past 600s
        # and would otherwise fail with a client-side timeout. No per-request cost.
        - "litellm_httpx_timeout_patch.litellm_httpx_timeout_patch_instance"
        - "bedrock_team_tag_hook.bedrock_team_tag_hook_instance"
        - "codex_additional_tools_flatten.codex_additional_tools_flatten_instance"
        - "prometheus"
        - "websearch_interception"
        - "s3_v2"
      websearch_interception_params:
        enabled_providers:
          - bedrock
          - bedrock_converse
        search_tool_name: searxng-search
      # S3 request/response logging (async batch, non-blocking; complete untruncated payload)
      s3_callback_params:
        s3_bucket_name: litellm-request-logs-<YOUR_ACCOUNT_ID>-us-east-1
        s3_region_name: us-east-1
      # Request/response logging (set to false in prod if PII concern)
      set_verbose: false
      json_logs: true

    # ============================================================
    # Search Tools — SearXNG for WebSearch Interception
    # ============================================================
    search_tools:
      - search_tool_name: searxng-search
        litellm_params:
          search_provider: searxng
          api_base: http://searxng:8080

    # ============================================================
    # General / Proxy Settings
    # ============================================================
    general_settings:
      use_x_forwarded_for: true
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
      database_connection_pool_limit: 10
      database_connection_timeout: 30
      allow_requests_on_db_unavailable: true
      # Share in-memory spend/budget state across all replicas via Redis
      redis_host: os.environ/REDIS_HOST
      redis_port: "6379"
      redis_password: os.environ/REDIS_PASSWORD
      redis_ssl: true
      # Batch spend writes to the DB every 60s instead of per-request
      proxy_batch_write_at: 60
      # Don't write LLM exceptions to the DB — S3 logging already has them all
      disable_error_logs: true

  codex_additional_tools_flatten.py: |
    """
    Codex `additional_tools` → top-level `tools` flatten hook for LiteLLM.

    Newer Codex (>=26.707, "Responses Lite" serialization) packs its tool list into
    a non-standard input item of shape:

        {"type": "additional_tools", "role": "developer", "tools": [ ... ]}

    Bedrock Mantle's Responses API (bedrock-mantle) only accepts the STANDARD OpenAI
    Responses schema, whose `input` items are message/reasoning/function_call/etc.
    `additional_tools` is a Codex-private variant, so Mantle rejects the whole body
    with `400 validation_error: Invalid 'input': value did not match any expected
    variant`. See Codex GitHub issue #32086.

    Verified out-of-band: Mantle DOES accept those same tools when placed in the
    standard top-level `tools` field (including Codex's `custom`/`namespace` tool
    types). So this hook rewrites the request pre-call:

      1. find every input item with type == "additional_tools"
      2. merge each one's `tools` into the top-level `data["tools"]`
      3. drop the additional_tools item(s) from `data["input"]`

    Codex >=0.147 additionally wraps the whole toolset in a container tool
    {"type": "namespace", "name": "functions", "tools": [...]} (openai/codex#37022,
    "Canonicalize default tools under the `functions` namespace"). "functions" is
    the RESERVED implicit namespace of classic function tools: the first-party
    OpenAI API special-cases it, but Mantle rejects it with 400 "User-defined
    namespace 'functions' collides with an existing tool namespace". So step 4:
    unwrap that ONE container after the merge — nested tools keep their bare names
    (exec, wait, ...) in output items either way, so this is lossless. Namespaces
    with any OTHER name pass through untouched (Mantle accepts those).

    Scope guard:
      - Only touches `aresponses` calls whose input actually contains an
        `additional_tools` item. Every other request returns untouched.
      - Wrapped in try/except: a rewrite failure logs and passes the ORIGINAL data
        through rather than dropping the request.
    """
    from litellm._logging import verbose_logger
    from litellm.integrations.custom_logger import CustomLogger

    # call_types that carry a Responses-API body (data["input"] / data["tools"])
    _RESPONSES_CALL_TYPES = {"aresponses"}


    def _unwrap_functions_namespace(tools):
        """Unwrap Codex >=0.147's namespace-"functions" container tool (see module
        docstring). Returns the rewritten list, or None when no container present."""
        if not isinstance(tools, list):
            return None
        hit = False
        out = []
        for t in tools:
            if (
                isinstance(t, dict)
                and t.get("type") == "namespace"
                and t.get("name") == "functions"
            ):
                hit = True
                nested = t.get("tools")
                if isinstance(nested, list):
                    out.extend(nested)
            else:
                out.append(t)
        return out if hit else None



    class CodexAdditionalToolsFlatten(CustomLogger):
        async def async_pre_call_hook(
            self, user_api_key_dict, cache, data, call_type
        ):
            if call_type not in _RESPONSES_CALL_TYPES:
                return data
            try:
                input_items = data.get("input")
                if not isinstance(input_items, list):
                    return data
                # Collect additional_tools items without mutating during iteration.
                # NOTE: `found` (did we see an additional_tools item?) is tracked
                # SEPARATELY from `extra_tools` (did that item carry any tools?).
                # A later Codex turn re-sends the additional_tools item with an
                # EMPTY tools list (tools already established earlier in the thread).
                # That empty item is still a non-standard variant Mantle rejects, so
                # it MUST be dropped from input even when there is nothing to merge —
                # keying the rewrite off `extra_tools` alone left the empty item in
                # place and produced 400 "Invalid 'input'" on every follow-up turn.
                found = False
                extra_tools = []
                kept_items = []
                for item in input_items:
                    if isinstance(item, dict) and item.get("type") == "additional_tools":
                        found = True
                        tools = item.get("tools")
                        if isinstance(tools, list):
                            extra_tools.extend(tools)
                        # drop the item (do not keep it in input)
                    else:
                        kept_items.append(item)
                if not found:
                    # No additional_tools item → non-Codex or already standard, but
                    # Codex may still have put the namespace-"functions" wrapper in
                    # top-level tools; unwrap it there too.
                    unwrapped = _unwrap_functions_namespace(data.get("tools"))
                    if unwrapped is not None:
                        data["tools"] = unwrapped
                        verbose_logger.info(
                            "CodexAdditionalToolsFlatten: unwrapped namespace-'functions' "
                            "container in top-level tools (model=%s)"
                            % str(data.get("model", ""))
                        )
                    return data
                # Drop the additional_tools item(s) from input unconditionally.
                data["input"] = kept_items
                # Merge any carried tools into top-level tools (preserve existing).
                if extra_tools:
                    existing = data.get("tools")
                    merged = (existing if isinstance(existing, list) else []) + extra_tools
                    unwrapped = _unwrap_functions_namespace(merged)
                    data["tools"] = unwrapped if unwrapped is not None else merged
                verbose_logger.info(
                    "CodexAdditionalToolsFlatten: removed additional_tools item(s), "
                    "flattened %d tool(s) into top-level tools (model=%s)"
                    % (len(extra_tools), str(data.get("model", "")))
                )
            except Exception as e:
                # Never fail a request over this rewrite — log and pass original through.
                verbose_logger.warning(
                    "CodexAdditionalToolsFlatten: flatten failed, passing through: %s" % e
                )
            return data


    # Module-level instance referenced by config.yaml callbacks:
    #   callbacks: ["codex_additional_tools_flatten.codex_additional_tools_flatten_instance"]
    codex_additional_tools_flatten_instance = CodexAdditionalToolsFlatten()

  bedrock_team_tag_hook.py: |
    """
    Bedrock per-team cost attribution hook for LiteLLM.

    On every `bedrock/` call, assume a dedicated exec role with an STS Session Tag
    `team=<team_alias>` and inject the temporary credentials into the request. AWS
    records the assumed-role principal in CUR 2.0's `line_item_iam_principal`, and
    the session tag surfaces as `iamPrincipal/team`, so Bedrock spend can be split
    by team in Cost Explorer.

    Mechanism (AWS IAM principal-based cost attribution, GA 2026-04):
      litellm-sa (IRSA) --AssumeRole + TagSession(team=X)--> bedrock-exec role
      --> Bedrock InvokeModel runs as assumed-role/bedrock-exec/litellm-<team>
      --> CUR: iamPrincipal/team = X

    Design:
      - Team-only for now. To extend to key/user later, add more entries to the
        `tags` list below (STS allows up to 50 session tags) and widen the cache key.
      - Per-team credential cache (55 min) to avoid hitting STS on every request
        (STS AssumeRole limit ~500/s/account). Temp creds last 1h; refresh at 55m.
      - Requests with NO team_alias are passed through untouched (no AssumeRole),
        so they keep working and fall under the pod's own IRSA principal in CUR.
      - Uses only boto3 + stdlib (both already in the image).

    Env:
      BEDROCK_EXEC_ROLE_ARN  - the exec role to assume (required to activate)
      AWS_REGION             - region for the STS client (defaults to pod region)
    """
    import os
    import re
    import time
    import threading

    import boto3
    from litellm._logging import verbose_logger
    from litellm.integrations.custom_logger import CustomLogger

    EXEC_ROLE_ARN = os.environ.get("BEDROCK_EXEC_ROLE_ARN", "")
    # Temp creds live 1h; refresh a little early.
    _CRED_TTL_SECONDS = 55 * 60
    # team_alias may contain chars STS tag values reject; tag values allow
    # [a-zA-Z0-9 _.:/=+@-], 256 max. Normalize anything else to '_'.
    _TAG_VALUE_RE = re.compile(r"[^a-zA-Z0-9_.:/=+@-]")


    def _safe_tag_value(value: str) -> str:
        return _TAG_VALUE_RE.sub("_", value)[:256]


    class BedrockTeamTagHook(CustomLogger):
        def __init__(self):
            super().__init__()
            self._sts = boto3.client("sts")
            # cache: team -> (creds_dict, expiry_epoch)
            self._cache = {}
            self._lock = threading.Lock()

        def _assume_for_team(self, team: str) -> dict:
            now = time.time()
            with self._lock:
                cached = self._cache.get(team)
                if cached and cached[1] > now:
                    return cached[0]
            # Cache miss / expired — assume the exec role with the team session tag.
            session_name = _safe_tag_value(f"litellm-{team}")[:64]
            resp = self._sts.assume_role(
                RoleArn=EXEC_ROLE_ARN,
                RoleSessionName=session_name,
                Tags=[{"Key": "team", "Value": _safe_tag_value(team)}],
                DurationSeconds=3600,
            )
            c = resp["Credentials"]
            creds = {
                "aws_access_key_id": c["AccessKeyId"],
                "aws_secret_access_key": c["SecretAccessKey"],
                "aws_session_token": c["SessionToken"],
            }
            with self._lock:
                self._cache[team] = (creds, now + _CRED_TTL_SECONDS)
            return creds

        async def async_pre_call_hook(
            self, user_api_key_dict, cache, data, call_type
        ):
            # Only act when an exec role is configured.
            if not EXEC_ROLE_ARN:
                return data
            team = getattr(user_api_key_dict, "team_alias", None)
            model = str(data.get("model", ""))
            verbose_logger.info(
                f"BedrockTeamTagHook.pre_call call_type={call_type} model={model!r} "
                f"team_alias={team!r}"
            )
            if not team:
                # No team → pass through (keeps untagged requests working).
                return data
            # Inject assumed-role creds for ALL team requests. At the proxy pre-call
            # hook, data["model"] is the PUBLIC model_name (e.g. 'bedrock-nova-pro'),
            # not the litellm_params 'bedrock/...' id, and custom_llm_provider is not
            # yet resolved — so we cannot reliably detect bedrock here. For non-bedrock
            # backends the injected aws_* keys are simply ignored, so this is safe.
            try:
                creds = self._assume_for_team(team)
                data["aws_access_key_id"] = creds["aws_access_key_id"]
                data["aws_secret_access_key"] = creds["aws_secret_access_key"]
                data["aws_session_token"] = creds["aws_session_token"]
            except Exception as e:
                # Never fail the request over attribution — log and pass through.
                verbose_logger.warning(
                    f"BedrockTeamTagHook: assume_role failed for team={team!r}: {e}"
                )
            return data


    # Module-level instance referenced by config.yaml callbacks:
    #   callbacks: ["bedrock_team_tag_hook.bedrock_team_tag_hook_instance"]
    bedrock_team_tag_hook_instance = BedrockTeamTagHook()

  litellm_httpx_timeout_patch.py: |
    """Raise LiteLLM's hardcoded httpx default timeout (workaround, remove after upgrade).

    WHY THIS EXISTS
    ---------------
    LiteLLM's ``/v1/messages`` (anthropic_messages) route drops every configured
    timeout. ``async_anthropic_messages_handler`` issues its ``.post()`` without a
    ``timeout=`` argument, so the request falls back to the module-level default in
    ``litellm.llms.custom_httpx.http_handler``, which is hardcoded:

        COMPLETION_HTTP_FALLBACK_SECONDS = 600.0   # litellm/constants.py

    The Router *does* resolve the right value and puts it in ``kwargs["timeout"]``,
    but that handler never reads it. Net effect on v1.84.3: ``router_settings.timeout``,
    ``litellm_settings.request_timeout``, per-model ``timeout`` and ``stream_timeout``
    are all silently ignored on that route, and non-streaming requests are capped at
    600s. Streaming is unaffected (httpx applies the read timeout per chunk, so a
    stream only needs its inter-chunk gap to stay under the limit).

    Observed impact: Claude Code agent-teams requests with very long output
    (~27k tokens) legitimately take 320-600s, so they sit right under the 600s
    ceiling and fail whenever generation runs slightly long. Retries reuse the same
    non-streaming path and fail identically.

    Upstream: issue #26752 / #30836, fixed by PR #33418 (merged 2026-07-15).
    The fix first appears in v1.94.0-rc.1 — NOT in any stable release up to v1.93.0,
    and it was never backported to the 1.84-1.93 stable lines.

    WHAT THIS DOES
    --------------
    Rebinds the module-level ``_DEFAULT_TIMEOUT`` at import time, before the proxy
    serves any request. ``get_async_httpx_client()`` reads that module global when it
    constructs (and caches) a client, so the new value applies to every client built
    afterwards. ``llm_http_handler`` does not import the name directly, so rebinding
    the module attribute is sufficient — there is no stale from-import binding.

    Loaded via ``callbacks:`` purely for its import side effect: LiteLLM resolves a
    callback module relative to the config dir (/app/config), which is where this
    file is mounted, so no PYTHONPATH change is needed. The callback class itself is
    a no-op and adds zero per-request overhead.

    SCOPE / CAVEATS
    ---------------
    ``_DEFAULT_TIMEOUT`` is shared by every provider client built without explicit
    params, so this raises the default ceiling proxy-wide rather than only on the
    affected route. Raising it only removes a cap (it never shortens a timeout), but
    a genuinely hung non-streaming call now holds its connection longer before
    erroring. 1200s is aligned with the ALB idle timeout — past that the load
    balancer cuts the connection first, so a larger value would not buy anything.

    ``connect`` is pinned to 5s explicitly so widening the read timeout does not also
    make connect failures take 20 minutes to surface.

    Not patched by this module: ``pass_through_endpoints.py`` passes an explicit
    ``params={"timeout": 600}``, so passthrough routes keep their own 600s cap.

    REMOVAL
    -------
    Delete this file, drop its entry from ``callbacks:``, and remove the
    ``configData`` line in cluster-stack.ts once the proxy runs a release containing
    PR #33418. Then set the real config keys (per-model ``timeout`` /
    ``stream_timeout``), which that release honours.
    """

    import os

    import httpx
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.llms.custom_httpx import http_handler as _http_handler

    # Aligned with the ALB idle timeout; override without rebuilding by setting the
    # env var on the deployment (e.g. back to "600" for a fast rollback).
    _TIMEOUT_SECONDS = float(os.getenv("LITELLM_HTTPX_DEFAULT_TIMEOUT", "1200"))
    _CONNECT_TIMEOUT_SECONDS = 5.0

    _PREVIOUS_TIMEOUT = getattr(_http_handler, "_DEFAULT_TIMEOUT", None)

    _http_handler._DEFAULT_TIMEOUT = httpx.Timeout(
        timeout=_TIMEOUT_SECONDS,
        connect=_CONNECT_TIMEOUT_SECONDS,
    )

    try:  # best effort: surface the patch in the proxy startup log
        from litellm._logging import verbose_proxy_logger

        verbose_proxy_logger.info(
            "httpx timeout patch applied: %s -> %s (workaround for litellm#26752)",
            _PREVIOUS_TIMEOUT,
            _http_handler._DEFAULT_TIMEOUT,
        )
    except Exception:  # pragma: no cover - logging must never break startup
        pass


    class HttpxTimeoutPatch(CustomLogger):
        """No-op callback. The patch above runs at import time; this only exists so
        LiteLLM's ``callbacks:`` list has an instance to load."""


    litellm_httpx_timeout_patch_instance = HttpxTimeoutPatch()
